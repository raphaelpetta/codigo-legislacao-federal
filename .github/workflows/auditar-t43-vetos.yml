name: T43 — cadeia oficial dos 9 vetos Lei 14129

on:
  pull_request:
    paths:
      - 'scripts/auditar_t43_vetos_2021.py'
      - 'modulos/T43/M04/MATRIZ_F1G_NOVE_POSICOES_VETOS_2021.csv'
      - '.github/workflows/auditar-t43-vetos.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vetos_historicos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Confrontar publicação original e compilação oficial
        run: python scripts/auditar_t43_vetos_2021.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t43-f1g-cadeia-vetos-2021
          path: /tmp/t43-f1g-vetos.json
          if-no-files-found: warn
