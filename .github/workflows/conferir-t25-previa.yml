name: Conferir previa penal T25 (39 origens CP1-12)

on:
  pull_request:
    paths:
      - "produto/fontes/T25_CP1_12_v1.json"
      - "produto/concordancia/T25_CP_ART1_12_39.csv"
      - "produto/vistas/T25_PENAL_PARTE_GERAL_CP1_12_PREVIA.md"
      - "scripts/gerar_previa_t25.py"
      - ".github/workflows/conferir-t25-previa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cotejar-cp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout corpus
        uses: actions/checkout@v4
        with:
          path: trabalho
      - name: Checkout setorial PR32 no SHA documentado
        uses: actions/checkout@v4
        with:
          ref: 3f0b56273caebfdbaba87ec4e87988da9f12c6c9
          path: setorial
          persist-credentials: false
      - name: Validar integridade documental penal
        run: python3 trabalho/scripts/gerar_previa_t25.py --setorial-root setorial --check
