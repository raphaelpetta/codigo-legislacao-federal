name: Extrair CPC 82 a 97 por unidade (F1-D)

on:
  pull_request:
    paths:
      - 'scripts/extrair_f1d_t24.py'
      - 'modulos/T24/M01/F1D_INVENTARIO_ART82_97_SUBUNIDADES.csv'
      - '.github/workflows/extrair-cpc-f1d.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extrair_75:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Preparar parser HTML
        run: python -m pip install beautifulsoup4
      - name: Conferir cobertura externa e histórico CPC 82-97
        run: python scripts/extrair_f1d_t24.py --json /tmp/f1d_75.json --csv /tmp/f1d_75.csv
      - name: Anexar evidencia com textos/hashes e diferencas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t24-f1d-espelho-textual-75
          path: |
            /tmp/f1d_75.json
            /tmp/f1d_75.csv
          if-no-files-found: warn
