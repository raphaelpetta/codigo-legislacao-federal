name: T43 — F1-F unidades finas Lei 14129 restante

on:
  pull_request:
    paths:
      - 'scripts/extrair_t43_restante_fino.py'
      - 'modulos/T43/M04/INVENTARIO_F1E_RESTANTE_ARTIGOS_10_41_44_55.csv'
      - '.github/workflows/extrair-t43-fino.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unidades_finas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: HTML parser
        run: python -m pip install beautifulsoup4
      - name: Conferir artigo 32, vetos e unidades finas
        run: python scripts/extrair_t43_restante_fino.py --csv /tmp/t43-f1f-unidades.csv --json /tmp/t43-f1f-unidades.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t43-f1f-artigos-restantes-unidades-finas
          path: |
            /tmp/t43-f1f-unidades.csv
            /tmp/t43-f1f-unidades.json
          if-no-files-found: warn
