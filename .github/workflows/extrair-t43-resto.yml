name: T43 — espelho artigos 10–41 e 44–55

on:
  pull_request:
    paths:
      - 'scripts/extrair_t43_resto_44.py'
      - 'modulos/T43/M04/INVENTARIO_F1E_RESTANTE_ARTIGOS_10_41_44_55.csv'
      - '.github/workflows/extrair-t43-resto.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extrair_resto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install beautifulsoup4
      - name: Recuperar 44 artigos restantes e auditar categorias
        run: python scripts/extrair_t43_resto_44.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: t43-espelho-44-artigos-restantes
          path: |
            /tmp/t43-44-artigos.json
            /tmp/t43-44-artigos.csv
          if-no-files-found: warn
