name: T07 ciclo34 — duas teses intimação editalícia
on:
  pull_request:
    paths:
      - 'modulos/T07/M03/MATRIZ_CICLO34_CONTRASTE_EDITAL_STJ.csv'
      - 'scripts/validar_t07_ciclo34_editais.py'
      - '.github/workflows/validar-t07-ciclo34.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  editais_em_contexto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/validar_t07_ciclo34_editais.py
