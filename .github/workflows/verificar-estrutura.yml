name: Verificar integridade estrutural CLF

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  estrutura:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar CSVs e links locais
        run: python scripts/verificar_estrutura.py
      - name: Conferir fila cooperativa e painel de produto derivado
        run: python scripts/controle_operacional.py --check
      - name: Testar reservas, colisao e bloqueios da fila
        run: python3 -m unittest discover -s tests -p 'test_controle_operacional.py' -v
