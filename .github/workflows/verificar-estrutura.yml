name: Verificar integridade estrutural CLF

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  estrutura:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verificar CSVs e links locais
        run: python scripts/verificar_estrutura.py
